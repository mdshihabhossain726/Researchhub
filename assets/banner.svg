<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="ResearchHub: Research Paper Management System" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1F52"/>
      <stop offset="0.55" stop-color="#1B3F8F"/>
      <stop offset="1" stop-color="#2F7BEA"/>
    </linearGradient>
    <linearGradient id="cyl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5E9BFF"/>
      <stop offset="0.5" stop-color="#9CC4FF"/>
      <stop offset="1" stop-color="#4C86E8"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.3" fill="#FFFFFF" fill-opacity="0.10"/>
    </pattern>
  </defs>

  <!-- background -->
  <rect width="1200" height="300" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="18" fill="url(#dots)"/>
  <circle cx="1080" cy="40" r="200" fill="#FFFFFF" fill-opacity="0.05"/>
  <circle cx="1180" cy="290" r="140" fill="#FFFFFF" fill-opacity="0.05"/>

  <!-- title block -->
  <text x="70" y="140" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="68" font-weight="800" fill="#FFFFFF" letter-spacing="1">ResearchHub</text>
  <text x="72" y="184" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" fill="#CFE0FF">Research Paper Management System</text>
  <rect x="72" y="202" width="90" height="5" rx="2.5" fill="#7FB2FF"/>

  <!-- technology pills -->
  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#FFFFFF" text-anchor="middle">
    <rect x="72"  y="226" width="120" height="32" rx="16" fill="#FFFFFF" fill-opacity="0.14" stroke="#FFFFFF" stroke-opacity="0.35"/>
    <text x="132" y="247">PostgreSQL</text>
    <rect x="204" y="226" width="60"  height="32" rx="16" fill="#FFFFFF" fill-opacity="0.14" stroke="#FFFFFF" stroke-opacity="0.35"/>
    <text x="234" y="247">SQL</text>
    <rect x="276" y="226" width="112" height="32" rx="16" fill="#FFFFFF" fill-opacity="0.14" stroke="#FFFFFF" stroke-opacity="0.35"/>
    <text x="332" y="247">PL/pgSQL</text>
    <rect x="400" y="226" width="86"  height="32" rx="16" fill="#FFFFFF" fill-opacity="0.14" stroke="#FFFFFF" stroke-opacity="0.35"/>
    <text x="443" y="247">Python</text>
    <rect x="498" y="226" width="96"  height="32" rx="16" fill="#FFFFFF" fill-opacity="0.14" stroke="#FFFFFF" stroke-opacity="0.35"/>
    <text x="546" y="247">Tkinter</text>
  </g>

  <!-- paper stack (back sheet) -->
  <g transform="translate(1000 62) rotate(-7 55 70)">
    <rect width="112" height="146" rx="10" fill="#FFFFFF" fill-opacity="0.45"/>
  </g>
  <!-- paper (front sheet) -->
  <g transform="translate(1010 70) rotate(6 55 70)">
    <rect width="112" height="146" rx="10" fill="#FFFFFF" fill-opacity="0.96"/>
    <rect x="16" y="20" width="62" height="9" rx="4.5" fill="#1B3F8F"/>
    <rect x="16" y="42" width="80" height="5" rx="2.5" fill="#9AA9C9"/>
    <rect x="16" y="56" width="74" height="5" rx="2.5" fill="#9AA9C9"/>
    <rect x="16" y="70" width="80" height="5" rx="2.5" fill="#9AA9C9"/>
    <rect x="16" y="84" width="58" height="5" rx="2.5" fill="#9AA9C9"/>
    <rect x="16" y="104" width="34" height="16" rx="8" fill="#2F7BEA"/>
    <rect x="56" y="104" width="34" height="16" rx="8" fill="#7FB2FF"/>
  </g>

  <!-- database cylinder -->
  <g transform="translate(860 64)">
    <path d="M0 28 V118 A65 24 0 0 0 130 118 V28 Z" fill="url(#cyl)"/>
    <ellipse cx="65" cy="28" rx="65" ry="24" fill="#C9DFFF"/>
    <path d="M0 66 A65 24 0 0 0 130 66" fill="none" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="3"/>
    <path d="M0 104 A65 24 0 0 0 130 104" fill="none" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="3"/>
    <ellipse cx="65" cy="28" rx="40" ry="11" fill="#FFFFFF" fill-opacity="0.35"/>
  </g>

  <!-- footer line -->
  <text x="1150" y="278" text-anchor="end" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#B8D0FF">Database Systems Lab · CSE 208 · BUBT</text>
</svg>
